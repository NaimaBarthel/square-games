spring.application.name=square-games
spring.messages.fallback-to-system-locale=false
spring.datasource.url=jdbc:postgresql://localhost:5432/square_games
spring.datasource.username=postgres
spring.datasource.password=postgres
# Empêche l'exécution automatique des scripts SQL bruts (comme schema.sql ou data.sql)
#    au démarrage pour éviter les conflits et laisser Hibernate gérer les tables.
spring.sql.init.mode=never
# Définition du profil actif par défaut (h2 ou postgresql)
spring.profiles.active=h2
# =========================================================
# Paramétrage JPA
# =========================================================
# Indique à Hibernate de créer/mettre à jour le schéma automatiquement
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL (y compris le CREATE TABLE au démarrage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Paramètres partagés
spring.jpa.open-in-view=true
# =========================================================
# Valeurs par défaut des jeux
# =========================================================

# Morpion (Tic-Tac-Toe) : grille 3x3, 2 joueurs
game.tictactoe.default-player-count=2
game.tictactoe.default-board-size=3

# Taquin (15 Puzzle) : grille 4x4, 1 joueur
game.taquin.default-player-count=1
game.taquin.default-board-size=4

# Puissance 4 (Connect Four) : grille 7 (largeur) ou taille standard, 2 joueurs
game.connectfour.default-player-count=2
game.connectfour.default-board-size=7

# URL de base du microservice square-users (tournant sur le port 8081).
#    Injectée dans UserRestClient via l'annotation @Value("${users.service.url}").
users.service.url=http://localhost:8081
