spring.application.name=square-games
spring.messages.fallback-to-system-locale=false
spring.datasource.url=jdbc:postgresql://localhost:5432/square_games
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.mode=always
# =========================================================
# Valeurs par défaut des jeux
# =========================================================

# Morpion (Tic-Tac-Toe) : grille 3x3, 2 joueurs
game.tictactoe.default-player-count=2
game.tictactoe.default-board-size=3

# Taquin (15 Puzzle) : grille 4x4, 1 joueur
game.taquin.default-player-count=1
game.taquin.default-board-size=4

# Puissance 4 (Connect Four) : grille 7 (largeur) ou taille standard, 2 joueurs
game.connectfour.default-player-count=2
game.connectfour.default-board-size=7
